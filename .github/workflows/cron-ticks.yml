name: Cron ticks

# Vercel Hobby solo permite un cron al día, así que las tareas programadas del
# CRM las dispara GitHub Actions:
#   - /api/automations/cron  → reanuda los pasos "esperar" de las automatizaciones
#   - /api/flows/cron        → limpia flujos abandonados
# GitHub Actions es "mejor esfuerzo": puede retrasarse unos minutos. Si se
# necesita precisión por minuto, usar n8n con un Schedule + HTTP Request.
#
# Requiere el secret AUTOMATION_CRON_SECRET y (opcional) la variable APP_URL.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  tick:
    name: Disparar cron
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://wacrm-zeta-three.vercel.app' }}
    steps:
      - name: automations/cron y flows/cron
        env:
          CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secreto AUTOMATION_CRON_SECRET"
            exit 1
          fi
          for path in automations/cron flows/cron; do
            curl -sf --retry 2 --retry-delay 5 -o /dev/null \
              -w "$path: %{http_code}\n" \
              -H "x-cron-secret: $CRON_SECRET" \
              "$APP_URL/api/$path"
          done
