name: Keepalive

# El plan gratis de Supabase pausa el proyecto tras 7 días sin actividad.
# Este workflow llama a /api/health con el secreto de cron; esa ruta hace una
# lectura real en la base de datos (cuenta como actividad) y responde 503 si
# la base no contesta, de modo que el job falla de forma visible y abre un
# issue en el repositorio.
#
# Requiere (Settings → Secrets and variables → Actions):
#   - Secret   AUTOMATION_CRON_SECRET  (el mismo valor que en Vercel)
#   - Variable APP_URL                 (opcional; por defecto la URL de producción)
#
# GitHub solo ejecuta `schedule` desde la rama por defecto (main). El secreto
# AUTOMATION_CRON_SECRET ya existe en el repositorio (el keepalive original
# corre a diario con éxito desde el 2026-10-13).

on:
  schedule:
    # Cada día a las 09:00 UTC: muy por debajo de la ventana de 7 días de pausa.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://wacrm-zeta-three.vercel.app' }}
    steps:
      - name: Comprobar app y base de datos
        env:
          CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secreto AUTOMATION_CRON_SECRET en el repositorio"
            exit 1
          fi
          curl -sf --retry 3 --retry-delay 10 -o /dev/null \
            -w "health: %{http_code}\n" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/health"

      - name: Abrir issue si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Keepalive de Supabase falló ($(date -u +%F))" \
            --body "El chequeo de salud falló. Revisa la ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
